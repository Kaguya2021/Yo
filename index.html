<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр фото</title>
    <!-- Автоматический редирект через meta-тег -->
    <meta http-equiv="refresh" content="0; url=photo.jpg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 90%;
            width: 400px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .photo-link {
            display: block;
            text-decoration: none;
            overflow: hidden;
            border-radius: 12px;
        }
        .photo-link img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            transition: transform 0.2s ease;
        }
        .photo-link:active img {
            transform: scale(0.98);
        }
        .caption {
            margin-top: 12px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <a href="photo.jpg" class="photo-link">
                <img src="photo.jpg" alt="Фото">
            </a>
            <p class="caption">Нажмите на фото, если переход не произошел автоматически :)</p>
        </div>
    </div>

    <script>
        // Редирект через JS для мгновенного перехода
        window.location.href = "photo.jpg";
    </script>
</body>
</html>
